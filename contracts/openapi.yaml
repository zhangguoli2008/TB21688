openapi: 3.0.3
info:
  title: SmartProcure SaaS Internal API
  version: 0.2.0
  description: >-
    本合同仅描述智采云自己的API，不代表淘宝、抖店、1688或拼多多官方API。
    所有真实平台功能默认关闭；开发只可通过Mock接口验证。
    M0身份/状态及M1店铺、销售订单和Mock事件路径实现；所有真实通道关闭。
    其他路径是后续里程碑的设计合同，尚未实现。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地Mock环境
security:
  - SessionCookie: []
tags:
  - name: Me
  - name: Stores
  - name: Orders
  - name: Sourcing
  - name: Purchases
  - name: Payments
  - name: Shipping
  - name: Aftersales
  - name: Reports
  - name: Audit
paths:
  /auth/csrf:
    get:
      tags: [Me]
      operationId: getCsrfToken
      summary: 获取本地会话的CSRF令牌，登录后应重新获取
      security: []
      responses:
        '200':
          description: CSRF token（禁止记录日志）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [token, headerName]
                    properties:
                      token: {type: string}
                      headerName: {type: string, enum: [X-CSRF-TOKEN]}
                  requestId: {type: string, format: uuid}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /auth/login:
    post:
      tags: [Me]
      operationId: demoLogin
      summary: 本地demo配置专用合成身份登录；不代表生产认证
      security: []
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [persona]
              properties:
                persona: {type: string, enum: [OWNER_A, SUPPORT_A, OWNER_B]}
      responses:
        '200':
          description: 已建立本地演示会话（HttpOnly cookie）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /auth/logout:
    post:
      tags: [Me]
      operationId: logout
      summary: 撤销当前会话
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: 会话已撤销
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [loggedOut]
                    properties:
                      loggedOut: {type: boolean, enum: [true]}
                  requestId: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /system/status:
    get:
      tags: [Me]
      operationId: getSystemStatus
      summary: 当前服务依赖的实际状态，需system.read权限
      responses:
        '200':
          description: 检查结果；单项DOWN不伪造成UP
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [mode, realChannelsEnabled, services]
                    properties:
                      mode: {type: string, enum: [MOCK]}
                      realChannelsEnabled: {type: boolean, enum: [false]}
                      services:
                        type: array
                        items:
                          type: object
                          required: [name, status]
                          properties:
                            name: {type: string, enum: [api, postgresql, redis, rabbitmq]}
                            status: {type: string, enum: [UP, DOWN, UNKNOWN]}
                  requestId: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /demo/resources/{id}:
    get:
      tags: [Me]
      operationId: getDemoResource
      summary: 仅demo的合成租户资源，跨租户返回404，需demo.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 当前租户合成资源
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [id, label, tenantId]
                    properties:
                      id: {type: string, format: uuid}
                      label: {type: string}
                      tenantId: {type: string, format: uuid}
                  requestId: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 当前用户及可访问租户
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /stores:
    get:
      tags:
      - Stores
      operationId: listStores
      summary: 当前租户与店铺数据范围内的Mock店铺
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    post:
      tags:
      - Stores
      operationId: createMockStore
      summary: 注册Mock店铺；stores.manage；真实OAuth未开放
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
  /stores/{storeId}:
    get:
      tags:
      - Stores
      operationId: getStore
      summary: 当前数据范围内店铺；不可见对象404
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Stores
      operationId: updateStore
      summary: 改名/禁用/模拟授权；version CAS，重复版本409；stores.manage
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdateRequest'
  /orders:
    get:
      tags:
      - Orders
      operationId: listOrders
      summary: orders.read；from含/to不含，按权威sourceUpdatedAt过滤；固定createdAt/id倒序
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: storeId
        in: query
        schema:
          type: string
          format: uuid
      - name: sourceStatus
        in: query
        schema:
          type: string
          enum:
          - UNPAID
          - PAID
          - CANCELLED
          - REFUNDING
          - REFUNDED
      - name: q
        in: query
        schema:
          type: string
          maxLength: 80
          description: 精确匹配外部订单号；不支持自由全文检索
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
  /orders/{orderId}:
    get:
      tags:
      - Orders
      operationId: getOrder
      summary: 销售子项与安全时间轴；跨租户/跨店铺范围404
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /mock/stores/{storeId}/scenarios:
    post:
      tags:
      - Orders
      operationId: simulateSalesEvents
      summary: 仅demo/test；orders.simulate；生成合成权威快照及签名事件；异步入库，DELAYED延迟至少2秒
      responses:
        '202':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockScenarioEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockScenarioRequest'
  /webhooks/mock/stores/{integrationId}:
    post:
      tags:
      - Orders
      operationId: receiveMockWebhook
      summary: 仅Mock回调；原始body最大4096字节；HMAC-SHA256 hex(timestamp + 点 + nonce + 点 + integrationId + 点 + rawBody)；时间窗过去300秒/未来30秒。相同eventId与body安全去重，同键不同body或nonce复用409。integration服务端映射租户，回调状态不可信，Worker重查权威快照。
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockWebhookEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Mock-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
      - name: X-Mock-Nonce
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Mock-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockWebhookEvent'
      security: []
  /sku-mappings:
    post:
      tags: [Sourcing]
      operationId: upsertSkuMapping
      summary: 创建/确认一个销售SKU到供应商SKU映射
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MappingCreateRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MappingEnvelope'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /purchase-intents:
    get:
      tags: [Purchases]
      operationId: listPurchaseIntents
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntentsEnvelope'}
  /purchase-intents/{intentId}/approve:
    post:
      tags: [Purchases]
      operationId: approvePurchaseIntent
      summary: 商家人工审核采购意图，不意味着扣款
      parameters:
        - {$ref: '#/components/parameters/IntentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntentEnvelope'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /purchase-intents/{intentId}/submit:
    post:
      tags: [Purchases]
      operationId: submitPurchaseIntent
      summary: 异步提交采购任务，不同步发起真实付款
      parameters:
        - {$ref: '#/components/parameters/IntentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已接受异步任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobEnvelope'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /purchases:
    get:
      tags: [Purchases]
      operationId: listPurchases
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchasesEnvelope'}
  /payment-policy:
    get:
      tags: [Payments]
      operationId: getPaymentPolicy
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyEnvelope'}
    put:
      tags: [Payments]
      operationId: updatePaymentPolicy
      summary: 修改付款策略；服务端审计且受权限/MFA保护
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentPolicy'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyEnvelope'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /payment-mandates:
    get:
      tags: [Payments]
      operationId: listPaymentMandates
      summary: 仅返回安全的签约状态摘要，不暴露秘钥
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MandatesEnvelope'}
  /purchases/{purchaseId}/checkout-entry:
    post:
      tags: [Payments]
      operationId: getOfficialCheckoutEntry
      summary: 创建或获取允许的官方付款入口；UNKNOWN状态禁止
      parameters:
        - {$ref: '#/components/parameters/PurchaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 官方平台付款入口或Mock专用入口
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutEnvelope'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
  /purchases/{purchaseId}/payment-status:
    get:
      tags: [Payments]
      operationId: getPaymentStatus
      summary: 查已验证的本地/上游权威支付状态摘要
      parameters:
        - {$ref: '#/components/parameters/PurchaseId'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentStatusEnvelope'}
  /purchases/{purchaseId}/cancel-request:
    post:
      tags: [Purchases]
      operationId: requestPurchaseCancel
      summary: 只代表申请取消，不代表上游退款完成
      parameters:
        - {$ref: '#/components/parameters/PurchaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobEnvelope'}
  /shipments:
    get:
      tags: [Shipping]
      operationId: listShipments
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentsEnvelope'}
  /aftersales:
    get:
      tags: [Aftersales]
      operationId: listAftersales
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AftersalesEnvelope'}
  /reports/overview:
    get:
      tags: [Reports]
      operationId: getOverviewReport
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportEnvelope'}
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEnvelope'}
  /webhooks/{platform}:
    post:
      tags: [Stores]
      security: []
      operationId: receiveProviderWebhook
      summary: 独立验签/防重放；不代表已拥有平台生产授权
      parameters:
        - name: platform
          in: path
          required: true
          schema: {type: string, enum: [TAOBAO, DOUYIN, MOCK]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '202': {description: 消息已接受，异步处理}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SPSESSION
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 160, pattern: "^[A-Za-z0-9_-]+$"}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IntentId:
      name: intentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PurchaseId:
      name: purchaseId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ErrorResponse:
      description: Structured failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        details: {type: object, additionalProperties: true}
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: {type: string, nullable: true}
    SalesPlatform:
      type: string
      enum: [TAOBAO, DOUYIN, MOCK]
    Store:
      type: object
      required:
      - id
      - platform
      - externalShopId
      - displayName
      - enabled
      - authStatus
      - authorizationExpiresAt
      - integrationId
      - version
      - mode
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - DOUYIN
          - TAOBAO
        externalShopId:
          type: string
          maxLength: 128
        displayName:
          type: string
          maxLength: 160
        enabled:
          type: boolean
        authStatus:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - REVOKED
        authorizationExpiresAt:
          type: string
          format: date-time
          nullable: true
        integrationId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: string
          enum:
          - MOCK
      additionalProperties: false
    SalesOrder:
      type: object
      required:
      - id
      - storeId
      - storeName
      - platform
      - externalOrderId
      - sourceStatus
      - localStatus
      - currency
      - paidAmountFen
      - paidAt
      - promisedShipAt
      - sourceUpdatedAt
      - sourceVersion
      - createdAt
      - version
      - mode
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
        platform:
          type: string
          enum:
          - DOUYIN
          - TAOBAO
        externalOrderId:
          type: string
        sourceStatus:
          type: string
          enum:
          - UNPAID
          - PAID
          - CANCELLED
          - REFUNDING
          - REFUNDED
        localStatus:
          type: string
          enum:
          - NEW
          - VERIFIED_PAID
          - CANCELLED
          - SUSPENDED
        currency:
          type: string
          enum:
          - CNY
        paidAmountFen:
          type: integer
          format: int64
          minimum: 0
        paidAt:
          type: string
          format: date-time
          nullable: true
        promisedShipAt:
          type: string
          format: date-time
          nullable: true
        sourceUpdatedAt:
          type: string
          format: date-time
        sourceVersion:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: string
          enum:
          - MOCK
      additionalProperties: false
    PurchaseIntent:
      type: object
      required: [id, salesOrderItemId, qty, state]
      properties:
        id: {type: string, format: uuid}
        salesOrderItemId: {type: string, format: uuid}
        qty: {type: integer, minimum: 1}
        estimatedTotalFen: {type: integer, format: int64, nullable: true}
        state: {type: string}
    Purchase:
      type: object
      required: [id, purchaseIntentId, state, currency]
      properties:
        id: {type: string, format: uuid}
        purchaseIntentId: {type: string, format: uuid}
        externalOrderId: {type: string, nullable: true}
        state: {type: string}
        totalFen: {type: integer, format: int64, nullable: true}
        currency: {type: string}
    PaymentPolicy:
      type: object
      required: [mode, maxSingleFen, maxDailyFen, minEstimatedProfitFen, isPaused]
      properties:
        mode: {type: string, enum: [MANUAL, AUTO, RULE_BASED]}
        maxSingleFen: {type: integer, format: int64, minimum: 0}
        maxDailyFen: {type: integer, format: int64, minimum: 0}
        minEstimatedProfitFen: {type: integer, format: int64}
        isPaused: {type: boolean}
    PaymentMandateSummary:
      type: object
      required: [id, supplierAccountId, status]
      properties:
        id: {type: string, format: uuid}
        supplierAccountId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, ACTIVE, REVOKED, EXPIRED]}
        expiresAt: {type: string, format: date-time, nullable: true}
    PaymentStatus:
      type: object
      required: [purchaseId, state, updatedAt]
      properties:
        purchaseId: {type: string, format: uuid}
        state: {type: string, enum: [NEW, WAIT_MERCHANT_PAYMENT, PAYING, UNKNOWN, PAID, FAILED]}
        updatedAt: {type: string, format: date-time}
        lastVerifiedAt: {type: string, format: date-time, nullable: true}
    MappingCreateRequest:
      type: object
      required: [storeId, salesSkuId, supplierOfferId, confirmed]
      properties:
        storeId: {type: string, format: uuid}
        salesSkuId: {type: string}
        supplierOfferId: {type: string, format: uuid}
        confirmed: {type: boolean}
    Mapping:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [REVIEW, CONFIRMED, PAUSED]}
    Shipment:
      type: object
      required: [id, purchaseOrderId, state]
      properties:
        id: {type: string, format: uuid}
        purchaseOrderId: {type: string, format: uuid}
        carrierCode: {type: string, nullable: true}
        trackingNumberMasked: {type: string, nullable: true}
        state: {type: string}
    Aftersale:
      type: object
      required: [id, salesOrderId, state, type]
      properties:
        id: {type: string, format: uuid}
        salesOrderId: {type: string, format: uuid}
        state: {type: string}
        type: {type: string}
    Audit:
      type: object
      required: [id, action, createdAt]
      properties:
        id: {type: string, format: uuid}
        action: {type: string}
        createdAt: {type: string, format: date-time}
        actorId: {type: string, format: uuid, nullable: true}
    Report:
      type: object
      required: [salesPaidFen, estimatedPurchaseFen, estimatedProfitFen, orderCount, currency]
      properties:
        salesPaidFen: {type: integer, format: int64}
        estimatedPurchaseFen: {type: integer, format: int64}
        estimatedProfitFen: {type: integer, format: int64}
        orderCount: {type: integer}
        currency: {type: string}
    MeEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [userId, email, tenantIds, currentTenantId, tenantName, roles, permissions, mode]
          properties:
            userId: {type: string, format: uuid}
            email: {type: string, format: email}
            tenantIds:
              type: array
              items: {type: string, format: uuid}
            currentTenantId: {type: string, format: uuid}
            tenantName: {type: string}
            roles:
              type: array
              items: {type: string}
            permissions:
              type: array
              items: {type: string}
            mode: {type: string, enum: [MOCK]}
        requestId: {type: string, format: uuid}
    StoreListEnvelope:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          type: object
          required:
          - items
          - total
          - limit
          - offset
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Store'
            total:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 1
              maximum: 100
            offset:
              type: integer
              minimum: 0
              maximum: 10000
          additionalProperties: false
        requestId:
          type: string
          format: uuid
      additionalProperties: false
    AuthStartEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            authorizationUrl: {type: string, format: uri}
            mode: {type: string, enum: [MOCK, OFFICIAL]}
        requestId: {type: string}
    OrdersEnvelope:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          type: object
          required:
          - items
          - total
          - limit
          - offset
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SalesOrder'
            total:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 1
              maximum: 100
            offset:
              type: integer
              minimum: 0
              maximum: 10000
          additionalProperties: false
        requestId:
          type: string
          format: uuid
      additionalProperties: false
    OrderEnvelope:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          $ref: '#/components/schemas/SalesOrderDetail'
        requestId:
          type: string
          format: uuid
      additionalProperties: false
    MappingEnvelope:
      type: object
      properties:
        data: {$ref: '#/components/schemas/Mapping'}
        requestId: {type: string}
    IntentsEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/PurchaseIntent'}}
            page: {$ref: '#/components/schemas/PageMeta'}
        requestId: {type: string}
    IntentEnvelope:
      type: object
      properties:
        data: {$ref: '#/components/schemas/PurchaseIntent'}
        requestId: {type: string}
    PurchasesEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Purchase'}}
            page: {$ref: '#/components/schemas/PageMeta'}
        requestId: {type: string}
    PolicyEnvelope:
      type: object
      properties:
        data: {$ref: '#/components/schemas/PaymentPolicy'}
        requestId: {type: string}
    MandatesEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PaymentMandateSummary'}
        requestId: {type: string}
    CheckoutEnvelope:
      type: object
      properties:
        data:
          type: object
          required: [mode, expiresAt]
          properties:
            mode: {type: string, enum: [MOCK, OFFICIAL]}
            checkoutUrl: {type: string, format: uri, nullable: true}
            expiresAt: {type: string, format: date-time}
        requestId: {type: string}
    PaymentStatusEnvelope:
      type: object
      properties:
        data: {$ref: '#/components/schemas/PaymentStatus'}
        requestId: {type: string}
    JobEnvelope:
      type: object
      properties:
        data:
          type: object
          required: [jobId, state]
          properties:
            jobId: {type: string, format: uuid}
            state: {type: string, enum: [QUEUED, REJECTED]}
        requestId: {type: string}
    ShipmentsEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Shipment'}}
            page: {$ref: '#/components/schemas/PageMeta'}
        requestId: {type: string}
    AftersalesEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Aftersale'}}
            page: {$ref: '#/components/schemas/PageMeta'}
        requestId: {type: string}
    ReportEnvelope:
      type: object
      properties:
        data: {$ref: '#/components/schemas/Report'}
        requestId: {type: string}
    AuditEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Audit'}}
            page: {$ref: '#/components/schemas/PageMeta'}
        requestId: {type: string}
    StoreCreateRequest:
      type: object
      required:
      - platform
      - externalShopId
      - displayName
      properties:
        platform:
          type: string
          enum:
          - DOUYIN
          - TAOBAO
        externalShopId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 160
      additionalProperties: false
    StoreUpdateRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        enabled:
          type: boolean
        authStatus:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - REVOKED
      additionalProperties: false
    StoreEnvelope:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          $ref: '#/components/schemas/Store'
        requestId:
          type: string
          format: uuid
      additionalProperties: false
    SalesOrderItem:
      type: object
      required:
      - id
      - externalItemId
      - externalSkuId
      - title
      - qty
      - paidAllocatedFen
      - cancelledQty
      - fulfilledQty
      properties:
        id:
          type: string
          format: uuid
        externalItemId:
          type: string
        externalSkuId:
          type: string
        title:
          type: string
        qty:
          type: integer
          minimum: 1
        paidAllocatedFen:
          type: integer
          format: int64
          minimum: 0
        cancelledQty:
          type: integer
          minimum: 0
        fulfilledQty:
          type: integer
          minimum: 0
      additionalProperties: false
    OrderTimelineEntry:
      type: object
      required:
      - id
      - eventId
      - action
      - sourceVersion
      - occurredAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
        action:
          type: string
        sourceVersion:
          type: integer
          format: int64
          minimum: 1
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false
    SalesOrderDetail:
      type: object
      required:
      - id
      - storeId
      - storeName
      - platform
      - externalOrderId
      - sourceStatus
      - localStatus
      - currency
      - paidAmountFen
      - paidAt
      - promisedShipAt
      - sourceUpdatedAt
      - sourceVersion
      - createdAt
      - version
      - mode
      - items
      - timeline
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
        platform:
          type: string
          enum:
          - DOUYIN
          - TAOBAO
        externalOrderId:
          type: string
        sourceStatus:
          type: string
          enum:
          - UNPAID
          - PAID
          - CANCELLED
          - REFUNDING
          - REFUNDED
        localStatus:
          type: string
          enum:
          - NEW
          - VERIFIED_PAID
          - CANCELLED
          - SUSPENDED
        currency:
          type: string
          enum:
          - CNY
        paidAmountFen:
          type: integer
          format: int64
          minimum: 0
        paidAt:
          type: string
          format: date-time
          nullable: true
        promisedShipAt:
          type: string
          format: date-time
          nullable: true
        sourceUpdatedAt:
          type: string
          format: date-time
        sourceVersion:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: string
          enum:
          - MOCK
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItem'
        timeline:
          description: 最近100条安全同步事件，按时间正序显示；完整审计检索留后续阶段。
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/OrderTimelineEntry'
      additionalProperties: false
    MockScenarioRequest:
      type: object
      required:
      - scenario
      - externalOrderId
      properties:
        scenario:
          type: string
          enum:
          - PAID
          - DUPLICATE
          - OUT_OF_ORDER
          - DELAYED
          - REFUNDED
        externalOrderId:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9_-]+$
      additionalProperties: false
    MockScenarioResult:
      type: object
      required:
      - scenario
      - externalOrderId
      - acceptedEvents
      - mode
      properties:
        scenario:
          type: string
          enum:
          - PAID
          - DUPLICATE
          - OUT_OF_ORDER
          - DELAYED
          - REFUNDED
        externalOrderId:
          type: string
        acceptedEvents:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - MOCK
      additionalProperties: false
    MockScenarioEnvelope:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          $ref: '#/components/schemas/MockScenarioResult'
        requestId:
          type: string
          format: uuid
      additionalProperties: false
    MockWebhookEvent:
      type: object
      required:
      - eventId
      - externalOrderId
      - sourceVersion
      - eventOccurredAt
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        externalOrderId:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9_-]+$
        sourceVersion:
          type: integer
          format: int64
          minimum: 1
        eventOccurredAt:
          type: string
          format: date-time
      additionalProperties: false
    MockWebhookEnvelope:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          type: object
          required:
          - eventId
          - duplicate
          - mode
          properties:
            eventId:
              type: string
            duplicate:
              type: boolean
            mode:
              type: string
              enum:
              - MOCK
          additionalProperties: false
        requestId:
          type: string
          format: uuid
      additionalProperties: false

name: SmartProcure checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: smartprocure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: smartprocure_test
          POSTGRES_USER: m0test
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U m0test -d smartprocure_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw --batch-mode -Pintegration verify
        env:
          M0_TEST_DB_URL: jdbc:postgresql://localhost:5432/smartprocure_test
          M0_TEST_DB_USER: m0test
          M0_TEST_DB_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: apps/api/target/*-reports/
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  contract-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: openapi-spec-validator contracts/openapi.yaml
      - run: python3 apps/web/scripts/generate-m2-contract.py --check
      - run: python3 apps/web/scripts/generate-m3-contract.py --check
      - run: python3 apps/web/scripts/generate-m4-contract.py --check
      - run: python3 scripts/check-safety.py
      - run: git diff --check
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/init-demo-env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - run: python3 scripts/smoke-m0.py
        env:
          M0_REQUIRE_HEALTHY: "1"
      - run: python3 scripts/smoke-m1.py
        env:
          M1_BASE_URL: http://localhost:8080/api/v1
      - run: python3 scripts/smoke-m2.py
        env:
          M2_BASE_URL: http://localhost:8080/api/v1
      - run: python3 scripts/smoke-m3.py
        env:
          M3_BASE_URL: http://localhost:8080/api/v1
      - run: python3 scripts/smoke-m4.py
        env:
          M4_BASE_URL: http://localhost:8080/api/v1
      - run: curl --fail http://localhost:4173/login
      - run: docker compose restart api && docker compose up --wait --wait-timeout 120
      - run: python3 scripts/smoke-m0.py
        env:
          M0_REQUIRE_HEALTHY: "1"
          M0_BASE_URL: http://localhost:4173/api/v1
      - run: python3 scripts/smoke-m1.py
        env:
          M1_BASE_URL: http://localhost:4173/api/v1
      - run: python3 scripts/smoke-m2.py
        env:
          M2_BASE_URL: http://localhost:4173/api/v1
      - run: python3 scripts/smoke-m3.py
        env:
          M3_BASE_URL: http://localhost:4173/api/v1
      - run: python3 scripts/smoke-m4.py
        env:
          M4_BASE_URL: http://localhost:4173/api/v1
      - run: docker compose down
        if: always()

openapi: 3.0.3
info:
  title: SmartProcure SaaS Internal API
  version: 0.3.0
  description: >-
    本合同仅描述智采云自己的API，不代表淘宝、抖店、1688或拼多多官方API。
    所有真实平台功能默认关闭；开发只可通过Mock接口验证。
    M0/M1身份、店铺与销售，以及M2映射、Mock报价和异步采购路径；所有真实通道关闭。
    M2创单成功仅为AWAITING_PAYMENT，CREATE_UNKNOWN只查单，不能声称真实采购/付款。
    其他路径是后续里程碑的设计合同，尚未实现。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地Mock环境
security:
  - SessionCookie: []
tags:
  - name: Me
  - name: Stores
  - name: Orders
  - name: Sourcing
  - name: Purchases
  - name: Payments
  - name: Shipping
  - name: Aftersales
  - name: Reports
  - name: Audit
paths:
  /auth/csrf:
    get:
      tags: [Me]
      operationId: getCsrfToken
      summary: 获取本地会话的CSRF令牌，登录后应重新获取
      security: []
      responses:
        '200':
          description: CSRF token（禁止记录日志）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [token, headerName]
                    properties:
                      token: {type: string}
                      headerName: {type: string, enum: [X-CSRF-TOKEN]}
                  requestId: {type: string, format: uuid}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /auth/login:
    post:
      tags: [Me]
      operationId: demoLogin
      summary: 本地demo配置专用合成身份登录；不代表生产认证
      security: []
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [persona]
              properties:
                persona: {type: string, enum: [OWNER_A, SUPPORT_A, OWNER_B]}
      responses:
        '200':
          description: 已建立本地演示会话（HttpOnly cookie）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /auth/logout:
    post:
      tags: [Me]
      operationId: logout
      summary: 撤销当前会话
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: 会话已撤销
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [loggedOut]
                    properties:
                      loggedOut: {type: boolean, enum: [true]}
                  requestId: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /system/status:
    get:
      tags: [Me]
      operationId: getSystemStatus
      summary: 当前服务依赖的实际状态，需system.read权限
      responses:
        '200':
          description: 检查结果；单项DOWN不伪造成UP
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [mode, realChannelsEnabled, services]
                    properties:
                      mode: {type: string, enum: [MOCK]}
                      realChannelsEnabled: {type: boolean, enum: [false]}
                      services:
                        type: array
                        items:
                          type: object
                          required: [name, status]
                          properties:
                            name: {type: string, enum: [api, postgresql, redis, rabbitmq]}
                            status: {type: string, enum: [UP, DOWN, UNKNOWN]}
                  requestId: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /demo/resources/{id}:
    get:
      tags: [Me]
      operationId: getDemoResource
      summary: 仅demo的合成租户资源，跨租户返回404，需demo.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 当前租户合成资源
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [id, label, tenantId]
                    properties:
                      id: {type: string, format: uuid}
                      label: {type: string}
                      tenantId: {type: string, format: uuid}
                  requestId: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 当前用户及可访问租户
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /stores:
    get:
      tags:
      - Stores
      operationId: listStores
      summary: 当前租户与店铺数据范围内的Mock店铺
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    post:
      tags:
      - Stores
      operationId: createMockStore
      summary: 注册Mock店铺；stores.manage；真实OAuth未开放
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
  /stores/{storeId}:
    get:
      tags:
      - Stores
      operationId: getStore
      summary: 当前数据范围内店铺；不可见对象404
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Stores
      operationId: updateStore
      summary: 改名/禁用/模拟授权；version CAS，重复版本409；stores.manage
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdateRequest'
  /orders:
    get:
      tags:
      - Orders
      operationId: listOrders
      summary: orders.read；from含/to不含，按权威sourceUpdatedAt过滤；固定createdAt/id倒序
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: storeId
        in: query
        schema:
          type: string
          format: uuid
      - name: sourceStatus
        in: query
        schema:
          type: string
          enum:
          - UNPAID
          - PAID
          - CANCELLED
          - REFUNDING
          - REFUNDED
      - name: q
        in: query
        schema:
          type: string
          maxLength: 80
          description: 精确匹配外部订单号；不支持自由全文检索
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
  /orders/{orderId}:
    get:
      tags:
      - Orders
      operationId: getOrder
      summary: 销售子项与安全时间轴；跨租户/跨店铺范围404
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /mock/stores/{storeId}/scenarios:
    post:
      tags:
      - Orders
      operationId: simulateSalesEvents
      summary: 仅demo/test；orders.simulate；生成合成权威快照及签名事件；异步入库，DELAYED延迟至少2秒
      responses:
        '202':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockScenarioEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockScenarioRequest'
  /webhooks/mock/stores/{integrationId}:
    post:
      tags:
      - Orders
      operationId: receiveMockWebhook
      summary: 仅Mock回调；原始body最大4096字节；HMAC-SHA256 hex(timestamp + 点 + nonce + 点 + integrationId + 点 + rawBody)；时间窗过去300秒/未来30秒。相同eventId与body安全去重，同键不同body或nonce复用409。integration服务端映射租户，回调状态不可信，Worker重查权威快照。
      responses:
        '200':
          description: Mock operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockWebhookEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Mock-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
      - name: X-Mock-Nonce
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Mock-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockWebhookEvent'
      security: []
  /supplier-offers:
    get:
      tags:
      - Sourcing
      operationId: listMockSupplierOffers
      summary: 租户合成货源列表，仅店主
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
      responses:
        '200':
          description: Mock / 待授权；不执行真实交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2OfferPageEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /supplier-offers/{offerId}/mock-config:
    patch:
      tags:
      - Sourcing
      operationId: configureMockSupplierOffer
      summary: 模拟价格库存及故障，version CAS
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Mock / 待授权；不执行真实交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2OfferEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M2OfferConfig'
  /supplier-offers/{offerId}/quotes:
    post:
      tags:
      - Sourcing
      operationId: quoteMockSupplierOffer
      summary: 获取持久报价快照，平台/地区能力独立核对
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Mock / 待授权；不执行真实交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2QuoteEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M2QuoteRequest'
  /sku-mappings:
    get:
      tags:
      - Sourcing
      operationId: listSkuMappings
      summary: 已确认备选与待审核映射列表
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
      - name: storeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: salesSkuId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - REVIEW
          - CONFIRMED
          - PAUSED
      responses:
        '200':
          description: Mock / 待授权；不执行真实交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2MappingPageEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
      - Sourcing
      operationId: createSkuMapping
      summary: 新建待审核映射，不能自动确认
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Mock / 待授权；不执行真实交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2MappingEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M2MappingCreate'
  /sku-mappings/{mappingId}:
    patch:
      tags:
      - Sourcing
      operationId: reviewSkuMapping
      summary: 人工规格与首购审核后确认，或暂停映射
      parameters:
      - name: mappingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Mock / 待授权；不执行真实交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2MappingEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M2MappingUpdate'
  /procurement-policy:
    get:
      tags:
      - Purchases
      operationId: getTenantProcurementPolicy
      summary: 租户Mock采购策略，与支付策略独立
      parameters: []
      responses:
        '200':
          description: Mock / 待授权；不执行真实交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2PolicyEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags:
      - Purchases
      operationId: updateTenantProcurementPolicy
      summary: 租户采购限额及预计利润，version CAS

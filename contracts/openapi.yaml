        '401': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SPSESSION
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 160, pattern: "^[A-Za-z0-9_-]+$"}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IntentId:
      name: intentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PurchaseId:
      name: purchaseId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ErrorResponse:
      description: Structured failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        details: {type: object, additionalProperties: true}
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: {type: string, nullable: true}
    SalesPlatform:
      type: string
      enum: [TAOBAO, DOUYIN, MOCK]
    Store:
      type: object
      required:
      - id
      - platform
      - externalShopId
      - displayName
      - enabled
      - authStatus
      - authorizationExpiresAt
      - integrationId
      - version
      - mode
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - DOUYIN
          - TAOBAO
        externalShopId:
          type: string
          maxLength: 128
        displayName:
          type: string
          maxLength: 160
        enabled:
          type: boolean
        authStatus:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - REVOKED
        authorizationExpiresAt:
          type: string
          format: date-time
          nullable: true
        integrationId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: string
          enum:
          - MOCK
      additionalProperties: false
    SalesOrder:
      type: object
      required:
      - id
      - storeId
      - storeName
      - platform
      - externalOrderId
      - sourceStatus
      - localStatus
      - currency
      - paidAmountFen
      - paidAt
      - promisedShipAt
      - sourceUpdatedAt
      - sourceVersion
      - createdAt
      - version
      - mode
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
        platform:
          type: string
          enum:
          - DOUYIN
          - TAOBAO
        externalOrderId:
          type: string
        sourceStatus:
          type: string
          enum:
          - UNPAID
          - PAID
          - CANCELLED
          - REFUNDING
          - REFUNDED
        localStatus:
          type: string
          enum:
          - NEW
          - VERIFIED_PAID
          - CANCELLED
          - SUSPENDED
        currency:
          type: string
          enum:
          - CNY
        paidAmountFen:
          type: integer
          format: int64
          minimum: 0
        paidAt:
          type: string
          format: date-time
          nullable: true
        promisedShipAt:
          type: string
          format: date-time
          nullable: true
        sourceUpdatedAt:
          type: string
          format: date-time
        sourceVersion:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: string
          enum:
          - MOCK
      additionalProperties: false
    PurchaseIntent:
      type: object
      required: [id, salesOrderItemId, qty, state]
      properties:
        id: {type: string, format: uuid}
        salesOrderItemId: {type: string, format: uuid}
        qty: {type: integer, minimum: 1}
        estimatedTotalFen: {type: integer, format: int64, nullable: true}
        state: {type: string}
    Purchase:
      type: object
      required: [id, purchaseIntentId, state, currency]
      properties:
        id: {type: string, format: uuid}
        purchaseIntentId: {type: string, format: uuid}
        externalOrderId: {type: string, nullable: true}
        state: {type: string}
        totalFen: {type: integer, format: int64, nullable: true}
        currency: {type: string}
    PaymentPolicy:
      type: object
      required: [mode, maxSingleFen, maxDailyFen, minEstimatedProfitFen, isPaused]
      properties:
        mode: {type: string, enum: [MANUAL, AUTO, RULE_BASED]}
        maxSingleFen: {type: integer, format: int64, minimum: 0}
        maxDailyFen: {type: integer, format: int64, minimum: 0}
        minEstimatedProfitFen: {type: integer, format: int64}
        isPaused: {type: boolean}
    PaymentMandateSummary:
      type: object
      required: [id, supplierAccountId, status]
      properties:
        id: {type: string, format: uuid}
        supplierAccountId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, ACTIVE, REVOKED, EXPIRED]}
        expiresAt: {type: string, format: date-time, nullable: true}
    PaymentStatus:
      type: object
      required: [purchaseId, state, updatedAt]
      properties:
        purchaseId: {type: string, format: uuid}
        state: {type: string, enum: [NEW, WAIT_MERCHANT_PAYMENT, PAYING, UNKNOWN, PAID, FAILED]}
        updatedAt: {type: string, format: date-time}
        lastVerifiedAt: {type: string, format: date-time, nullable: true}
    MappingCreateRequest:
      type: object
      required: [storeId, salesSkuId, supplierOfferId, confirmed]
      properties:
        storeId: {type: string, format: uuid}
        salesSkuId: {type: string}
        supplierOfferId: {type: string, format: uuid}
        confirmed: {type: boolean}
    Mapping:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [REVIEW, CONFIRMED, PAUSED]}
    Shipment:
      type: object
      required: [id, purchaseOrderId, state]
      properties:
        id: {type: string, format: uuid}
        purchaseOrderId: {type: string, format: uuid}
        carrierCode: {type: string, nullable: true}
        trackingNumberMasked: {type: string, nullable: true}
        state: {type: string}
    Aftersale:
      type: object
      required: [id, salesOrderId, state, type]
      properties:
        id: {type: string, format: uuid}
        salesOrderId: {type: string, format: uuid}
        state: {type: string}
        type: {type: string}
    Audit:
      type: object
      required: [id, action, createdAt]
      properties:
        id: {type: string, format: uuid}
        action: {type: string}
        createdAt: {type: string, format: date-time}
        actorId: {type: string, format: uuid, nullable: true}
    Report:
      type: object
      required: [salesPaidFen, estimatedPurchaseFen, estimatedProfitFen, orderCount, currency]
      properties:
        salesPaidFen: {type: integer, format: int64}
        estimatedPurchaseFen: {type: integer, format: int64}
        estimatedProfitFen: {type: integer, format: int64}
        orderCount: {type: integer}
        currency: {type: string}
    MeEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [userId, email, tenantIds, currentTenantId, tenantName, roles, permissions, mode]
          properties:
            userId: {type: string, format: uuid}
            email: {type: string, format: email}
            tenantIds:
              type: array
              items: {type: string, format: uuid}
            currentTenantId: {type: string, format: uuid}
            tenantName: {type: string}
            roles:
              type: array
              items: {type: string}
            permissions:
              type: array
              items: {type: string}
            mode: {type: string, enum: [MOCK]}
        requestId: {type: string, format: uuid}
    StoreListEnvelope:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          type: object
          required:
          - items
          - total
          - limit
          - offset
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Store'
            total:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 1
